<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | CO-PO Mapping Agent</title>
  
  <!-- Modern Editorial & Scholarly Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <!-- Modern Off-White Glassmorphism Stylesheet -->
  <link rel="stylesheet" href="/static/login.css?v=3.0">

  <!-- Google Identity Services (GIS) Client SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.GOOGLE_CLIENT_ID = "{{ google_client_id or '' }}";
  </script>
</head>

<body>
  <!-- APPLICATION TOPBAR (MATCHING SYSTEM HEADER) -->
  <header class="topbar">
    <a class="brand" href="/">◈ CO-PO Mapping Agent</a>
    <p>Automated CO-PO Syllabus Extraction & AI Mapping</p>
  </header>

  <!-- AMBIENT BACKGROUND WITH SOFT SAGE & MINT REFRACTION -->
  <div class="ambient-background">
    <div class="orb orb-emerald"></div>
    <div class="orb orb-mint"></div>
    <div class="orb orb-cyan"></div>
    <div class="orb orb-ivory"></div>
    <div class="grid-mesh"></div>
  </div>

  <!-- LOGIN VIEWPORT -->
  <div class="login-viewport" id="login-viewport">
    <div class="login-wrapper">
      
      <!-- MODERN OFF-WHITE GLASSMORPHIC CARD -->
      <div class="glass-card" id="glass-login-card">
        <div class="glass-reflection"></div>

        <!-- CLEAN BRAND HEADER -->
        <div class="card-header">
          <h1 class="card-title">
            ◈ CO-PO Mapping Agent
          </h1>
          <p class="card-subtitle">
            Sign in to access curriculum mapping and outcome attainment calculation.
          </p>
        </div>

        <!-- ACTIONS: GOOGLE LOGIN & DEMO LOGIN ONLY -->
        <div class="actions-section">
          <!-- Google Sign-In Button -->
          <button type="button" id="btn-google-login" class="btn-google-gateway">
            <!-- Official Multicolor Google SVG -->
            <svg class="google-icon" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span class="btn-google-text">Sign in with Google</span>
          </button>

          <!-- Native GIS Container (if initialized) -->
          <div id="google-signin-btn-container" style="display: none;"></div>

          <!-- Divider -->
          <div class="glass-divider">
            <div class="divider-line"></div>
            <span class="divider-text">OR</span>
            <div class="divider-line"></div>
          </div>

          <!-- Single Clean Demo Button -->
          <button type="button" id="btn-demo-login" class="btn-demo-gateway">
            <span class="demo-icon">⚡</span>
            <span>Demo Login</span>
          </button>
        </div>

      </div>

      <!-- PORTAL FOOTER -->
      <footer class="portal-footer">
        <p>Curriculum Intelligence & Outcome Attainment Calculation Platform</p>
      </footer>

    </div>
  </div>

  <!-- GLASS TOAST NOTIFICATION -->
  <div id="login-toast" class="glass-toast">
    <span class="glass-spinner" style="display: none;" id="toast-spinner"></span>
    <span id="toast-message">Notification</span>
  </div>

  <!-- SCRIPT -->
  <script src="/static/login.js?v=3.0"></script>
</body>

</html>
